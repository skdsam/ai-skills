<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phosphor knob mockup</title>
<style>
  body {
    background: #0c0d12;
    margin: 0;
    padding: 48px;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #e8eef7;
  }
  .panel {
    width: 180px;
    height: 220px;
    background: #14161d;
    border: 1px solid #22252f;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
  }
  .knob-container {
    width: 120px;
    height: 120px;
    position: relative;
  }
  .knob-well {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: #0e1015;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6),
                inset 0 -1px 2px rgba(255,255,255,0.03);
  }
  .knob-body {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%,
                #3a404c 0%, #242935 45%, #16181e 100%);
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.55),
                0 1px 0 rgba(255,255,255,0.04);
  }
  .knob-arc {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .knob-arc svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .knob-arc-track {
    stroke: #22252f;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
  }
  .knob-arc-value {
    stroke: #4ffbe0;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #4ffbe0)
            drop-shadow(0 0 6px rgba(79,251,224,0.7))
            drop-shadow(0 0 12px rgba(79,251,224,0.35));
  }
  .knob-pointer {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2px;
    height: 42px;
    background: #4ffbe0;
    transform-origin: top center;
    transform: translate(-50%, -2px) rotate(45deg);
    filter: drop-shadow(0 0 3px #4ffbe0)
            drop-shadow(0 0 6px rgba(79,251,224,0.6));
    border-radius: 1px;
  }
  .label {
    margin-top: 14px;
    color: #9aa3b2;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
  }
  .value {
    margin-top: 4px;
    color: #e8eef7;
    font-size: 13px;
    font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
    font-feature-settings: 'tnum';
  }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="knob-container" id="knob">
      <div class="knob-well"></div>
      <div class="knob-body"></div>
      <div class="knob-arc">
        <svg viewBox="0 0 120 120">
          <!-- track arc: from angle 225° (bottom-left) to 315° (bottom-right),
               sweeping clockwise over the top. Radius 48px. -->
          <path class="knob-arc-track"
                d="M 25.09 85.09 A 48 48 0 1 1 94.91 85.09" />
          <!-- value arc: partial, representing ~60% of full sweep.
               Ends around 45° relative to vertical (45° clockwise). -->
          <path class="knob-arc-value"
                d="M 25.09 85.09 A 48 48 0 1 1 93.94 25.94" />
        </svg>
      </div>
      <div class="knob-pointer"></div>
    </div>
    <div class="label">Cutoff</div>
    <div class="value">780 Hz</div>
  </div>
</body>
</html>
